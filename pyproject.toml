[project]
name = "cpq"
version = "0.1.0"
description = "Certain, possible or predicted answers to quality queries over partially measured configuration spaces"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "mapie>=1.6.0",
    "cotengra>=0.8.2",
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
julia = ["juliacall==0.9.36"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.170.3",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpq"]

[tool.ruff]
line-length = 100
extend-exclude = ["probe"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
"experiments/mutants.py" = ["E501"]
"experiments/results.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: large DIMACS models"]
